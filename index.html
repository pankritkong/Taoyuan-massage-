<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบัญชีร้านนวด - Massage POS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts - Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wood: {
                            50: '#fbf8f5',
                            100: '#f6f0ea',
                            500: '#8c6d58',
                            800: '#4a382c',
                            900: '#2d2119',
                        },
                        sage: {
                            500: '#5b7065',
                            600: '#47584f',
                        }
                    },
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-wood-50 text-wood-900 font-sans min-h-screen pb-12">

    <!-- Screen Locker (หน้าล็อกรหัสผ่าน) -->
    <div id="lockScreen" class="fixed inset-0 bg-wood-900/95 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm text-center">
            <div class="w-16 h-16 bg-wood-100 text-wood-800 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="lock" class="w-8 h-8"></i>
            </div>
            <h2 class="text-xl font-bold text-wood-800 mb-1">เข้าสู่ระบบบัญชีร้านนวด</h2>
            <p id="pinInstruction" class="text-xs text-gray-500 mb-6">กรอกรหัสผ่าน 4 หลักเพื่อใช้งาน (ค่าเริ่มต้น: 1234)</p>
            
            <div class="flex justify-center gap-3 mb-6">
                <input type="password" maxlength="1" class="pin-input w-12 h-14 border-2 border-wood-100 rounded-xl text-center text-2xl font-bold focus:border-wood-800 focus:outline-none" readonly>
                <input type="password" maxlength="1" class="pin-input w-12 h-14 border-2 border-wood-100 rounded-xl text-center text-2xl font-bold focus:border-wood-800 focus:outline-none" readonly>
                <input type="password" maxlength="1" class="pin-input w-12 h-14 border-2 border-wood-100 rounded-xl text-center text-2xl font-bold focus:border-wood-800 focus:outline-none" readonly>
                <input type="password" maxlength="1" class="pin-input w-12 h-14 border-2 border-wood-100 rounded-xl text-center text-2xl font-bold focus:border-wood-800 focus:outline-none" readonly>
            </div>

            <!-- Keypad -->
            <div class="grid grid-cols-3 gap-3 max-w-[240px] mx-auto mb-4">
                <button onclick="pressPin('1')" class="h-12 rounded-xl bg-wood-50 font-bold text-xl active:bg-wood-100">1</button>
                <button onclick="pressPin('2')" class="h-12 rounded-xl bg-wood-50 font-bold text-xl active:bg-wood-100">2</button>
                <button onclick="pressPin('3')" class="h-12 rounded-xl bg-wood-50 font-bold text-xl active:bg-wood-100">3</button>
                <button onclick="pressPin('4')" class="h-12 rounded-xl bg-wood-50 font-bold text-xl active:bg-wood-100">4</button>
                <button onclick="pressPin('5')" class="h-12 rounded-xl bg-wood-50 font-bold text-xl active:bg-wood-100">5</button>
                <button onclick="pressPin('6')" class="h-12 rounded-xl bg-wood-50 font-bold text-xl active:bg-wood-100">6</button>
                <button onclick="pressPin('7')" class="h-12 rounded-xl bg-wood-50 font-bold text-xl active:bg-wood-100">7</button>
                <button onclick="pressPin('8')" class="h-12 rounded-xl bg-wood-50 font-bold text-xl active:bg-wood-100">8</button>
                <button onclick="pressPin('9')" class="h-12 rounded-xl bg-wood-50 font-bold text-xl active:bg-wood-100">9</button>
                <button onclick="clearPin()" class="h-12 rounded-xl bg-red-50 text-red-600 font-bold text-xs flex items-center justify-center">ลบทั้งหมด</button>
                <button onclick="pressPin('0')" class="h-12 rounded-xl bg-wood-50 font-bold text-xl active:bg-wood-100">0</button>
                <button onclick="backspacePin()" class="h-12 rounded-xl bg-gray-100 font-bold text-sm flex items-center justify-center"><i data-lucide="delete" class="w-5 h-5"></i></button>
            </div>
            <p id="pinError" class="text-xs text-red-500 hidden">รหัสผ่านไม่ถูกต้อง ลองใหม่อีกครั้ง</p>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-wood-900 text-white p-4 shadow-md sticky top-0 z-40">
        <div class="max-w-md mx-auto
